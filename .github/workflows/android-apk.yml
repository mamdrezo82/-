name: Build RoozYar Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare Web Assets (Create www)
        run: |
          mkdir -p www
          cp -r * www/ || true
          rm -rf www/www www/.git www/.github

      - name: Check JavaScript syntax
        run: node --check www/app.js

      - name: Install dependencies
        run: npm install

      - name: Build plugin bridge
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Patch Android project (save-file plugin, permissions)
        run: node scripts/setup-android.mjs

      - name: Fix Capacitor 7 Java Import
        run: |
          sed -i 's|import com.getcapacitor.ActivityResult;|import androidx.activity.result.ActivityResult;|' android/app/src/main/java/com/roozyar/personal/RoozYarSaveFilePlugin.java

      - name: Generate launcher icons
        run: npx capacitor-assets generate --android

      - name: Sync Android project
        run: npx cap sync android

      # ساخت نسخه دیباگ (که خودکار امضا می‌شود)
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoozYar-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
